# Rime default settings
# encoding: utf-8

config_version: "2025-04-25"

schema_list:
  #- schema: lufs_flypy # 小鹤双拼
  - schema: lufs_pinyin # 朙月拼音
  # - schema: lufs_mspy # 微软双拼
  # - schema: lufs_dpy # 自然码双拼
  # - schema: lufs_pyjj # 拼音加加双拼

switcher:
  caption: "[方案菜单]"
  hotkeys:
    # macos上需要按fn+F2才能呼出菜单
    - F2
  save_options:
    - full_shape
    - ascii_punct
    - traditionalization
    - emoji_suggestion
  fold_options: true
  abbreviate_options: true
  option_list_separator: "/"

menu:
  page_size: 7
  # alternative_select_labels: [ 壹, 貳, 叄, 肆, 伍, 陸, 柒, 捌, 玖, 拾 ]  # 候选项序号


# 中西文切换
#
# good_old_caps_lock:
# true   切换大写
# false  切换中英
# macOS 偏好设置的优先级更高，如果勾选【使用大写锁定键切换“ABC”输入法】则始终会切换输入法。
#
# 切换中英：
# 不同的选项表示：打字打到一半时按下了 CapsLock、Shift、Control 后：
# commit_code  上屏原始的编码，然后切换到英文
# commit_text  上屏拼出的词句，然后切换到英文
# clear        清除未上屏内容，然后切换到英文
# inline_ascii 切换到临时英文模式，按回车上屏后回到中文状态
# noop         屏蔽快捷键，不切换中英，但不要屏蔽 CapsLock
#
# 使用Shift, Control, Alt, Super等修饰键切换中英。# librime >= 1.14.0
# set_ascii_mode   切换到英文模式
# unset_ascii_mode 切换到中文模式
ascii_composer:
  good_old_caps_lock: true  # true | false
  switch_key:
    # ✅macos上 配合Fn键切换大小写+关闭"使用中英文键切换输入法" 可以实现比较完美的效果
    Caps_Lock: commit_code      # commit_code | commit_text | clear
    Shift_L: noop  # commit_code | commit_text | inline_ascii | clear | noop | set_ascii_mode | unset_ascii_mode
    Shift_R: noop         # commit_code | commit_text | inline_ascii | clear | noop | set_ascii_mode | unset_ascii_mode
    Control_L: noop       # commit_code | commit_text | inline_ascii | clear | noop | set_ascii_mode | unset_ascii_mode
    Control_R: noop       # commit_code | commit_text | inline_ascii | clear | noop | set_ascii_mode | unset_ascii_mode

# 处理输入栏内光标的移动
# 需要 librime >= 1.16.0 才有 no_loop 等属性，才会自动在方案引用 default:/{navigator,selector}
# 在边界按音节移动，在音节内部按字符移动  rewind | forward
# 按字符移动（循环）       left_by_char | right_by_char
# 按字符移动（不循环）     left_by_char_no_loop | right_by_char_no_loop
# 按音节跳转（循环）       left_by_syllable | right_by_syllable
# 按音节跳转（不循环）     left_by_syllable_no_loop | right_by_syllable_no_loop
# 首尾跳转               home | end
navigator:
  bindings:
    Left: left_by_char_no_loop
    Right: right_by_char_no_loop
    Shift+Left: left_by_syllable
    Shift+Right: right_by_syllable
    # 其他键 KP_Left KP_Right Home KP_Home End KP_End

###################################################################################

# 处理符合特定规则的输入码，如网址、反查
# 此处配置较为通用的选项，各方案中另增加了和方案功能绑定的 patterns。
recognizer:
  patterns:
    # 禁止部分输入的自动上屏
    camel: "[a-z]+[A-Z].*$" # 驼峰命名
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$" # email 地址
    html: "^<[a-z]+>$" # HTML TAG
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$" # 大写开头

    ## URL 捕获，和逗号句号翻页有冲突
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$" # URL 输入
    url_plus: "^[a-z]+[.:].*$" # URL 输入加强版（匹配 URL 标准规范 [协议类型]://[服务器地址]:[端口号]/[资源层级UNIX文件路径][文件名]?[查询]#[片段ID]）

    # 响应功能
    punct: "^/([0-9]0?|[A-Za-z]+)$" # 响应 lufs_symbols.yaml 内的输入
    unicode: "^U[a-f0-9]+" # 响应 Unicode

key_binder:
  select_first_character: "bracketleft" # lua 选词快捷键，选第一个字，关闭留空或删除本条
  select_last_character: "bracketright" # lua 选词快捷键，选最后一个字，关闭留空或删除本条
  bindings:
    # Tab / Shift + Tab 翻页
    - { when: has_menu, accept: Tab, send: Page_Down } # Tab 向下翻页
    - { when: has_menu, accept: Shift+Tab, send: Page_Up } # Shift + Tab 向上翻页

    # = / - 翻页
    - { when: has_menu, accept: equal, send: Page_Down } # = 向下翻页
    - { when: has_menu, accept: minus, send: Page_Up } # - 向上翻页

    # . / , 翻页
    # 和 URL 捕获正则可能有一定的冲突，需要手动注释 recognizer/patterns 下的 url 和 url_plus
    # - { when: has_menu, accept: period, send: Page_Down } # 句号向下翻页
    # - { when: has_menu, accept: comma, send: Page_Up } # 逗号向上翻页

    # ] / [ 翻页
    # 失效设置，可通过关闭/更改 lua 选词的快捷键恢复
    # 关闭方法，将 key_binder/select_first_character 和 key_binder/select_last_character 留空或删除
    # - { when: has_menu, accept: bracketright, send: Page_Down } # 右括号向下翻页
    # - { when: has_menu, accept: bracketleft, send: Page_Up } # 左括号向上翻页

    # 候选操作
    # ; 二选 ' 三选
    - { when: has_menu, accept: semicolon, send: 2 } # 输入时「;」二选
    # - { when: has_menu, accept: apostrophe, send: 3 } # 输入时「'」三选

    # Rime key bindings
